name: bid-arena
services:
  mysql:
    image: mysql:8.4.8
    environment:
      MYSQL_DATABASE: ${DB_NAME:-bid_arena}
      MYSQL_USER: ${DB_USER:-bid_arena}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run npm run setup:env first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run npm run setup:env first}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    ports: ["127.0.0.1:${MYSQL_PORT:-3307}:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      APP_ENV: ${APP_ENV:-production}
      SEED_DEMO: ${SEED_DEMO:-false}
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-bid_arena}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: ${DB_USER:-bid_arena}
      DB_PASSWORD: ${DB_PASSWORD:?Run npm run setup:env first}
      BACKEND_PORT: 8080
    ports: ["127.0.0.1:${BACKEND_PORT:-8080}:8080"]
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/v1/health"]
      interval: 5s
      timeout: 7s
      retries: 20
      start_period: 30s
  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    ports: ["127.0.0.1:${FRONTEND_PORT:-5173}:80"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mysql-data:
