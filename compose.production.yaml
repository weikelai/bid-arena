name: bid-arena-production
services:
  mysql:
    image: bid-arena-mysql-production
    build: { context: ., dockerfile: deploy/Dockerfile.mysql }
    environment:
      MYSQL_DATABASE: ${PROD_DB_NAME:?Set dedicated production schema}
      MYSQL_ROOT_PASSWORD: ${PROD_ROOT_PASSWORD:?Set independent root secret}
    volumes: ["production-data:/var/lib/mysql"]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql -uroot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
  migrate:
    image: bid-arena-backend
    profiles: [ops]
    command: [migrate]
    environment:
      APP_ENV: production
      DB_URL: jdbc:mysql://mysql:3306/${PROD_DB_NAME}?connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      MIGRATION_DB_USER: ${PROD_MIGRATION_USER:?Set migration identity}
      MIGRATION_DB_PASSWORD: ${PROD_MIGRATION_PASSWORD:?Set migration secret}
    networks: [data]
    depends_on: { mysql: { condition: service_healthy } }
    # Bootstrap stdout is returned once to the attached trusted terminal, not retained by Docker logs.
    logging: { driver: none }
  backend:
    image: bid-arena-backend
    environment:
      APP_ENV: production
      SEED_DEMO: "false"
      APPROVED_HTTPS_PROXY: "true"
      DB_URL: jdbc:mysql://mysql:3306/${PROD_DB_NAME}?connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: ${PROD_RUNTIME_USER:?Set runtime identity}
      DB_PASSWORD: ${PROD_RUNTIME_PASSWORD:?Set runtime secret}
      BACKEND_PORT: 8080
    networks: [data, app]
    depends_on: { mysql: { condition: service_healthy } }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/api/v1/health]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
  frontend:
    image: bid-arena-frontend
    networks: [app]
    depends_on: { backend: { condition: service_healthy } }
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1/]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
  ingress:
    image: bid-arena-ingress
    build: { context: ., dockerfile: deploy/Dockerfile.ingress }
    ports: ["${HTTPS_BIND:-127.0.0.1}:${HTTPS_PORT:-8443}:8443"]
    volumes:
      - ./deploy/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIRECTORY:?Mount a certificate directory}:/run/tls:ro
    networks: [app]
    depends_on: { frontend: { condition: service_healthy } }
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
networks:
  data: { internal: true }
  app: {}
volumes:
  production-data: {}
